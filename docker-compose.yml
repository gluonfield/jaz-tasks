services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jaztasks
      POSTGRES_PASSWORD: jaztasks
      POSTGRES_DB: jaztasks
    ports:
      - "55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaztasks"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres:

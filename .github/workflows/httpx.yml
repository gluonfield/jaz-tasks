name: Shared HTTP middleware

on:
  push:
    branches: [main]
    paths: ['httpx/**', '.github/workflows/httpx.yml']
  pull_request:
    paths: ['httpx/**', '.github/workflows/httpx.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'
          cache: false
      - working-directory: httpx
        run: |
          go test -race ./...
          go vet ./...

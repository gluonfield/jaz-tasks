<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · {{.App}}</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f5f6; --card: #fff; --ink: #1c1d1f; --muted: #5f6168; --border: #e7e7e9; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e0e10; --card: #1a1b1d; --ink: #e6e7ea; --muted: #a0a3aa; --border: #343437; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: min(320px, calc(100vw - 40px)); text-align: center; }
    h1 { margin: 0 0 24px; font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
    button, a { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 42px; padding: 8px 16px; border: 1px solid var(--border); border-radius: 9px; background: var(--card); color: var(--ink); font: inherit; font-weight: 500; text-decoration: none; cursor: pointer; }
    button:hover, a:hover { filter: brightness(.97); }
    button:disabled { opacity: .6; cursor: wait; }
    button:focus-visible, a:focus-visible { outline: 2px solid #7480ea; outline-offset: 3px; }
    svg { width: 18px; height: 18px; flex: none; }
    p { margin: 16px 0 0; color: var(--muted); }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in to {{.App}}</h1>
    {{if .Provider}}
    {{if .Firebase}}<button id="sign-in" type="button" disabled>{{else}}<a href="{{.LoginURL}}">{{end}}
      {{if eq .Provider "Google"}}
      <svg viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.97 10.71A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.17.29-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3.01-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.96l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      {{end}}
      Continue with {{.Provider}}
    {{if .Firebase}}</button>{{else}}</a>{{end}}
    {{else}}<p>Sign-in is not configured.</p>{{end}}
    <p id="status" role="status" hidden></p>
  </main>
  {{if .Firebase}}
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js'
    import { getAuth, GoogleAuthProvider, inMemoryPersistence, setPersistence, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js'

    const auth = getAuth(initializeApp({{.Firebase}}))
    await setPersistence(auth, inMemoryPersistence)
    const button = document.getElementById('sign-in')
    const status = document.getElementById('status')
    button.disabled = false
    button.addEventListener('click', async () => {
      button.disabled = true
      status.hidden = true
      try {
        const result = await signInWithPopup(auth, new GoogleAuthProvider())
        const response = await fetch('/auth/firebase', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': {{.CSRF}} },
          body: JSON.stringify({ idToken: await result.user.getIdToken() }),
        })
        if (!response.ok) {
          throw new Error(response.status === 403 ? 'Access denied. Please restart sign-in.' : 'Could not sign in. Please try again.')
        }
        const { redirect } = await response.json()
        await signOut(auth)
        window.location.replace(redirect)
      } catch (error) {
        status.textContent = error.code === 'auth/popup-closed-by-user' ? 'Sign-in cancelled.' : (error.code ? 'Could not sign in. Please try again.' : error.message)
        status.hidden = false
        button.disabled = false
      }
    })
  </script>
  {{end}}
</body>
</html>
